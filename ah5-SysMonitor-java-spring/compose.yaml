name: ah5-sysmonitor
services:
  sysmonitor:
    build:
      context: .
    image: arrowhead-sysmonitor-standalone:5.4.0
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    pids_limit: 256
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777", "/app/logs:rw,noexec,nosuid,nodev,size=32m,mode=1777"]
    ports: ["${HOST_BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-8475}:8475"]
    environment:
      LOCAL_CLOUD: ${LOCAL_CLOUD:-TestCloud}
      ORGANIZATION: ${ORGANIZATION:-Company}
      SERVICE_REGISTRY_ADDRESS: ${SERVICE_REGISTRY_ADDRESS:-serviceregistry}
      SERVICE_REGISTRY_PORT: "${SERVICE_REGISTRY_PORT:-8443}"
      AMQP_HOST: ${AMQP_HOST:-amqp-broker}
      AMQP_PORT: "${AMQP_PORT:-5671}"
      SYSMONITOR_ENABLED: "${SYSMONITOR_ENABLED:-true}"
      MQTT_HOST: ${MQTT_HOST:-mqtt-broker}
      MQTT_PORT: "${MQTT_PORT:-8883}"
      SYSMONITOR_RETENTION_DAYS: "${SYSMONITOR_RETENTION_DAYS:-30}"
      SYSMONITOR_PRUNE_INTERVAL_SECONDS: "${SYSMONITOR_PRUNE_INTERVAL_SECONDS:-3600}"
      SYSMONITOR_DEFAULT_SUBSCRIPTION: "${SYSMONITOR_DEFAULT_SUBSCRIPTION:-all}"
      ORCHESTRATION_INTERVAL_SECONDS: "${ORCHESTRATION_INTERVAL_SECONDS:-30}"
    secrets:
      - source: store-password
        target: ah.store-password
      - source: identity-password
        target: ah.identity-password
      - source: db-password
        target: ah.db-password
    volumes:
      # the system's own embedded database; no other container mounts it
      - state:/data
      - type: bind
        source: ${SYSTEM_KEYSTORE_FILE:-./security/SysMonitor.p12}
        target: /certs/SysMonitor.p12
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${TRUSTSTORE_FILE:-./security/truststore.p12}
        target: /certs/truststore.p12
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${CRL_DIRECTORY:-./security/crl}
        target: /crl
        read_only: true
        bind: {create_host_path: false}
    networks:
      cloud:
        aliases: [sysmonitor]
volumes:
  state: {}
networks:
  cloud:
    external: true
    name: ${ARROWHEAD_NETWORK:-arrowhead-local-cloud}
secrets:
  identity-password:
    file: ${IDENTITY_PASSWORD_FILE:-./security/identity-password}
  store-password:
    file: ${STORE_PASSWORD_FILE:-./security/store-password}
  db-password:
    file: ${DB_PASSWORD_FILE:-./security/db-password}
