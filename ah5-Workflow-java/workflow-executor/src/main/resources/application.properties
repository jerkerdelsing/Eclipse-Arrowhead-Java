############################################
###       APPLICATION PARAMETERS         ###
############################################

# The system name is the executor's identity (certificate CN with TLS). Run several executors with different names.
spring.application.name=WorkflowExecutor
server.address=0.0.0.0
server.port=8483

# Embedded database: only the common-library log table (generalManagement get-log). No other persistent state.
spring.datasource.url=jdbc:h2:file:./data/workflowexecutor;MODE=MariaDB;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update

mqtt.api.enabled=false

sysmonitor.enabled=true
sysmonitor.broker.address=amqp-broker
sysmonitor.broker.port=5671
sysmonitor.service.instance=WorkflowExecutor
sysmonitor.publish.interval=30

############################################
###          CUSTOM PARAMETERS           ###
############################################

domain.name=127.0.0.1
authentication.policy=declared
enable.management.filter=true
management.policy=authorization
enable.blacklist.filter=false
force.blacklist.filter=true
log.all.request.and.response=false
allow.self.addressing=true
allow.non.routable.addressing=false
normalization.mode=extended

# cap(w): capability descriptions satisfied by this executor (eta(s) in cap(w)), comma-separated
workflow.executor.capabilities=
# Service definitions this executor can run; * = any
workflow.executor.services=*
workflow.executor.workstation=
# push: the WorkflowManager calls start; pull: this executor claims open work items
workflow.executor.mode=push
workflow.executor.poll-ms=500
workflow.executor.threads=8
workflow.executor.lease-poll-ms=200
# Only this system may call workflowExecution start/abort
workflow.manager.system-name=WorkflowManager

# Option A: also act as executor of the existing Choreographer for the services listed above
workflow.choreographer.enabled=false
workflow.choreographer.system-name=Choreographer
workflow.choreographer.min-version=1
workflow.choreographer.max-version=1

# Development only (no ServiceRegistry):
#   workflow.manager.url=http://127.0.0.1:8482
#   workflow.executor.static-providers=serviceDefinition|http://host:port/basePath|op=POST:/path;...
workflow.standalone=false
workflow.manager.url=
workflow.executor.static-providers=

############################################
###             SSL MODE                 ###
############################################

server.ssl.enabled=false
server.ssl.key-store-type=PKCS12
server.ssl.key-store=classpath:certificate/WorkflowExecutor.p12
server.ssl.key-store-password=123456
server.ssl.key-alias=WorkflowExecutor.${arrowhead.cloud.name:TestCloud}.Company.arrowhead.eu
server.ssl.key-password=123456
server.ssl.client-auth=none
server.ssl.trust-store-type=PKCS12
server.ssl.trust-store=classpath:certificate/truststore.p12
server.ssl.trust-store-password=123456
disable.hostname.verifier=false
