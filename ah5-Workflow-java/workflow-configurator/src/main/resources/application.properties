############################################
###       APPLICATION PARAMETERS         ###
############################################

spring.application.name=WorkflowConfigurator
server.address=0.0.0.0
server.port=8484

# Embedded database: only the common-library log table (generalManagement get-log). The workflows themselves are stored
# in the WorkflowManager (workflowRecipe), never here.
spring.datasource.url=jdbc:h2:mem:workflowconfigurator;MODE=MariaDB;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update

mqtt.api.enabled=false

sysmonitor.enabled=false
sysmonitor.broker.address=amqp-broker
sysmonitor.broker.port=5671
sysmonitor.service.instance=WorkflowConfigurator
sysmonitor.publish.interval=30

############################################
###          CUSTOM PARAMETERS           ###
############################################

domain.name=127.0.0.1
authentication.policy=declared
enable.management.filter=true
management.policy=sysop-only
enable.blacklist.filter=false
force.blacklist.filter=true
log.all.request.and.response=false
allow.self.addressing=true
allow.non.routable.addressing=false
normalization.mode=extended
service.authorization.enabled=false

# Browser console: plain HTTP on the loopback interface with a password login (0 disables it). The password hash has the
# LocalCloudManager console format "scrypt:<salt base64>:<hash base64>" (N=16384, r=8, p=1); without it every login is refused.
console.port=8485
console.address=127.0.0.1
console.password-hash=
console.allowed-hosts=localhost,127.0.0.1,[::1]
console.session-seconds=28800

# Providers the configurator consumes (through orchestration)
workflow.configurator.manager=WorkflowManager
workflow.configurator.local-cloud-configurator=LocalCloudConfigurator
workflow.configurator.solc-configurator=SoLocalCloudConfigurator
workflow.configurator.solc.enabled=true
# Development only: no ServiceRegistry registration (the providers are then unreachable)
workflow.standalone=false
# Service definitions left out of the editor's palette
workflow.configurator.hidden-services=sysMonitor,generalManagement

############################################
###             SSL MODE                 ###
############################################

server.ssl.enabled=false
server.ssl.key-store-type=PKCS12
server.ssl.key-store=classpath:certificate/WorkflowConfigurator.p12
server.ssl.key-store-password=123456
server.ssl.key-alias=WorkflowConfigurator.${arrowhead.cloud.name:TestCloud}.Company.arrowhead.eu
server.ssl.key-password=123456
server.ssl.client-auth=none
server.ssl.trust-store-type=PKCS12
server.ssl.trust-store=classpath:certificate/truststore.p12
server.ssl.trust-store-password=123456
disable.hostname.verifier=false
