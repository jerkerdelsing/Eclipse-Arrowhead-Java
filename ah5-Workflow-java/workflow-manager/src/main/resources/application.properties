############################################
###       APPLICATION PARAMETERS         ###
############################################

server.address=0.0.0.0
server.port=8482

# WorkflowManager owns this database, embedded in its own process: recipes, sessions (state snapshots), work items, leases, worklog and logs.
spring.datasource.url=jdbc:h2:file:${DATABASE_DIRECTORY:./data}/ah_workflow;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;IGNORECASE=TRUE;CACHE_SIZE=16384;INIT=RUNSCRIPT FROM 'classpath:database/schema.sql'
spring.datasource.username=workflowmanager
spring.datasource.password=change-me
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate
# column types of the MySQL-compatible schema: times as UTC timestamps
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=BINARY
spring.jpa.properties.hibernate.timezone.default_storage=NORMALIZE
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

mqtt.api.enabled=false

# Native sysMonitor by the common-library publisher (echo is degraded while the database cannot be reached).
sysmonitor.enabled=true
sysmonitor.broker.address=amqp-broker
sysmonitor.broker.port=5671
sysmonitor.service.instance=WorkflowManager
sysmonitor.publish.interval=30

############################################
###          CUSTOM PARAMETERS           ###
############################################

domain.name=127.0.0.1
authentication.policy=declared
enable.management.filter=true
management.policy=authorization
enable.blacklist.filter=false
force.blacklist.filter=true
log.all.request.and.response=false
allow.self.addressing=true
allow.non.routable.addressing=false
normalization.mode=extended

# push (WorkflowManager selects the executor), pull (executors claim) or event (claimed like pull; EventHandler not wired)
workflow.dispatch.default=push
# Executors not found in the ServiceRegistry, separated by ';':
#   name|scheme://host:port|capability,capability|serviceDefinition,serviceDefinition|workstation   ('*' = any service)
workflow.executors=
workflow.executor.discovery.cache-seconds=10
# Seconds an open (pull) work item may wait for a claim before S-FailBind
workflow.pull.claim-timeout=300
# Executors are asked (workflowExecution.get-status) whether they still run what they hold: check interval (0 = never), and
# how long an unreachable executor may stay away before its work items count as lost
workflow.executor.liveness.check-seconds=30
workflow.executor.liveness.lost-after-seconds=300
workflow.worker.threads=8
workflow.lease.default-duration=120
# Compensation extension (outside the proven model): release a failed session's leases at once
workflow.lease.release-on-failure=false
# Identity of this work centre towards the Intelligent Product (workflowProduct.retrieve-process-step)
workflow.workstation.id=
workflow.validator.catalogue-check=true
# C01 needs a complete ServiceRegistry lookup (service.discovery.direct.access or the OPEN discovery policy)
workflow.validator.catalogue-check.services=true
# Development only: no ServiceRegistry; executors from workflow.executors
workflow.standalone=false

############################################
###             SSL MODE                 ###
############################################

# Development sample only; see SECURITY-PROFILE.md in the repository root for deployments.
server.ssl.enabled=false
server.ssl.key-store-type=PKCS12
server.ssl.key-store=classpath:certificate/WorkflowManager.p12
server.ssl.key-store-password=123456
server.ssl.key-alias=WorkflowManager.${arrowhead.cloud.name:TestCloud}.Company.arrowhead.eu
server.ssl.key-password=123456
server.ssl.client-auth=none
server.ssl.trust-store-type=PKCS12
server.ssl.trust-store=classpath:certificate/truststore.p12
server.ssl.trust-store-password=123456
disable.hostname.verifier=false
