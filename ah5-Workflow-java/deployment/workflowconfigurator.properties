# Secure deployment overrides for the WorkflowConfigurator (mutual TLS, outsourced authentication with identity tokens,
# provider-side ConsumerAuthorization, password-protected browser console). Secrets come from files in /run/secrets
# (configtree): ah.store-password, ah.identity-password, ah.console-password-hash.
# Start with --spring.config.additional-location=file:<this file>.
spring.config.import=configtree:/run/secrets/
spring.application.name=WorkflowConfigurator
server.address=0.0.0.0
server.port=8484
domain.name=${DOMAIN_NAME:workflowconfigurator}
arrowhead.cloud.name=${LOCAL_CLOUD:TestCloud}
server.ssl.enabled=true
server.ssl.key-store=file:/certs/WorkflowConfigurator.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${ah.store-password}
server.ssl.key-password=${ah.store-password}
server.ssl.key-alias=WorkflowConfigurator.${LOCAL_CLOUD:TestCloud}.${ORGANIZATION:Company}.arrowhead.eu
server.ssl.trust-store=file:/certs/truststore.p12
server.ssl.trust-store-type=PKCS12
server.ssl.trust-store-password=${ah.store-password}
server.ssl.client-auth=need
server.ssl.enabled-protocols=TLSv1.3,TLSv1.2
disable.hostname.verifier=false
authentication.policy=outsourced
authenticator.credentials={'password':'${ah.identity-password}'}
service.interface.policy=CERT_AUTH
management.policy=sysop-only
service.authorization.enabled=true
enable.blacklist.filter=${ENABLE_BLACKLIST_FILTER:false}
# certificate revocation: set arrowhead.ssl.crl-file (environment ARROWHEAD_SSL_CRL_FILE) to the cloud CA CRL, e.g. /crl/ca.crl
service.registry.address=${SERVICE_REGISTRY_ADDRESS:serviceregistry}
service.registry.port=${SERVICE_REGISTRY_PORT:8443}
spring.datasource.url=jdbc:h2:mem:workflowconfigurator;MODE=MariaDB;DATABASE_TO_LOWER=TRUE
# Console: inside a container it listens on all interfaces; publish it only to the host's loopback (127.0.0.1:8485:8485).
console.port=8485
console.address=${CONSOLE_ADDRESS:0.0.0.0}
console.password-hash=${ah.console-password-hash:}
console.allowed-hosts=${CONSOLE_ALLOWED_HOSTS:localhost,127.0.0.1,[::1]}
workflow.configurator.solc.enabled=${WFC_SOLC_ENABLED:true}
sysmonitor.enabled=${SYSMONITOR_ENABLED:false}
sysmonitor.broker.address=${AMQP_HOST:amqp-broker}
sysmonitor.broker.port=${AMQP_PORT:5671}
sysmonitor.local.cloud=${LOCAL_CLOUD:TestCloud}
sysmonitor.ssl.key-store=file:/certs/WorkflowConfigurator.p12
sysmonitor.ssl.key-store-password=${ah.store-password}
sysmonitor.ssl.trust-store=file:/certs/truststore.p12
sysmonitor.ssl.trust-store-password=${ah.store-password}
mqtt.api.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
