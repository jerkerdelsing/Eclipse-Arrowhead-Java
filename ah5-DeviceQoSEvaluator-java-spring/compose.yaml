name: ah5-device-qos-evaluator
services:
  device-qos-evaluator:
    build:
      context: .
    image: arrowhead-device-qos-evaluator-standalone:5.4.0
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    pids_limit: 256
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777", "/app/logs:rw,noexec,nosuid,nodev,size=32m,mode=1777"]
    ports: ["${HOST_BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-8472}:8472"]
    environment:
      # Bounded JVM inside the 1 GiB container limit: heap, metaspace, direct buffers and thread stacks (60 Quartz
      # threads) are capped, the JVM exits on OutOfMemoryError instead of being OOM-killed by the kernel, and native
      # memory tracking allows `jcmd 1 VM.native_memory summary` when memory grows (OOM kill after 2.5 days, 2026-11-17).
      JAVA_TOOL_OPTIONS: ${DEVICE_QOS_EVALUATOR_JAVA_OPTIONS:--Xms64m -Xmx256m -XX:MaxMetaspaceSize=192m -XX:MaxDirectMemorySize=128m -Xss512k -XX:NativeMemoryTracking=summary -XX:+ExitOnOutOfMemoryError}
      LOCAL_CLOUD: ${LOCAL_CLOUD:-TestCloud}
      ORGANIZATION: ${ORGANIZATION:-Company}
      SERVICE_REGISTRY_ADDRESS: ${SERVICE_REGISTRY_ADDRESS:-serviceregistry}
      SERVICE_REGISTRY_PORT: "${SERVICE_REGISTRY_PORT:-8443}"
      AMQP_HOST: ${AMQP_HOST:-amqp-broker}
      AMQP_PORT: "${AMQP_PORT:-5671}"
      SYSMONITOR_ENABLED: "${SYSMONITOR_ENABLED:-true}"
    secrets:
      - source: store-password
        target: ah.store-password
      - source: identity-password
        target: ah.identity-password
      - source: db-password
        target: ah.db-password
    volumes:
      # the system's own embedded database; no other container mounts it
      - state:/data
      - type: bind
        source: ${SYSTEM_KEYSTORE_FILE:-./security/DeviceQoSEvaluator.p12}
        target: /certs/DeviceQoSEvaluator.p12
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${TRUSTSTORE_FILE:-./security/truststore.p12}
        target: /certs/truststore.p12
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${CRL_DIRECTORY:-./security/crl}
        target: /crl
        read_only: true
        bind: {create_host_path: false}
    networks:
      cloud:
        aliases: [device-qos-evaluator]
volumes:
  state: {}
networks:
  cloud:
    external: true
    name: ${ARROWHEAD_NETWORK:-arrowhead-local-cloud}
secrets:
  identity-password:
    file: ${IDENTITY_PASSWORD_FILE:-./security/identity-password}
  store-password:
    file: ${STORE_PASSWORD_FILE:-./security/store-password}
  db-password:
    file: ${DB_PASSWORD_FILE:-./security/db-password}
